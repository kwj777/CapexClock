<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Netlify scans this static file at deploy time to register the
      "early-access" and "paid-interest" forms. The real forms live in the
      React app (src/components/SignupForm.tsx and
      src/components/paid/TellMeFirstForm.tsx) and POST here, with fetch or,
      before JavaScript loads, as a normal form post.
      Keep field names in sync with those components.
    -->
    <form name="early-access" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="early-access" />
      <input name="bot-field" />
      <input type="email" name="email" required />
      <select name="units">
        <option value="1–4">1–4</option>
        <option value="5–20">5–20</option>
        <option value="21–50">21–50</option>
        <option value="51–100">51–100</option>
        <option value="100+">100+</option>
      </select>
      <select name="current_method">
        <option value="Spreadsheet">Spreadsheet</option>
        <option value="Property management software">Property management software</option>
        <option value="Nothing formal">Nothing formal</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" name="biggest_worry" />
    </form>
    <!-- "Tell me first" sign-ups from the paid-idea buttons (src/lib/paid-ideas.ts). -->
    <form name="paid-interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="paid-interest" />
      <input name="bot-field" />
      <input type="email" name="email" required />
      <select name="units">
        <option value="1–4">1–4</option>
        <option value="5–20">5–20</option>
        <option value="21–50">21–50</option>
        <option value="51–100">51–100</option>
        <option value="100+">100+</option>
      </select>
      <!-- reminders, report or photo -->
      <input type="text" name="idea" />
      <!-- calculator, property or pricing -->
      <input type="text" name="where" />
    </form>
  </body>
</html>
