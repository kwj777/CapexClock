[build]
  # Lint and tests run first, so a failing check stops the deploy. --ci makes a
  # missing saved result (src/__parity__/__snapshots__) fail instead of being written.
  command = "npm run lint && npm run typecheck:engine && npm test -- --ci && npm run test:engine && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly because Netlify's automatic Next.js detection did not
# apply the runtime to this project (the site was linked before the repo had
# any Next.js code). Without it, deploys publish raw .next output and 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
