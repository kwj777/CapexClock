[build]
  # Lint and tests run first, so a failing check stops the deploy. --ci makes a
  # missing saved result (src/__parity__/__snapshots__) fail instead of being written.
  # The blog's posts (content/blog) are copied into src/lib/blog-posts.json first, so a post merged
  # without re-running the script still ships.
  command = "node scripts/build-blog-data.mjs && npm run lint && npm run typecheck:engine && npm test -- --ci && npm run test:engine && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly because Netlify's automatic Next.js detection did not
# apply the runtime to this project (the site was linked before the repo had
# any Next.js code). Without it, deploys publish raw .next output and 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The daily member emails (netlify/functions/owner-emails.mts). @react-pdf/renderer
# is loaded from node_modules as it is, rather than bundled, because it ships
# ES modules with WebAssembly that bundling can break.
[functions]
  external_node_modules = ["@react-pdf/renderer"]
  # pdfkit (under @react-pdf/renderer) loads its built-in fonts and color profile
  # through package "imports" paths at run time, which Netlify's file tracing
  # misses, so they're listed here. Without them the condition report crashes with
  # "Cannot find module .../pdfkit/js/standard-fonts/Helvetica.cjs".
  included_files = ["node_modules/pdfkit/js/standard-fonts/**", "node_modules/pdfkit/js/data/**"]
